<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Mert (physic)</title>
  <desc id="desc">Full stack developer building web, mobile and desktop apps at Anysola.</desc>
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#8075ff"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.35" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.22"/>
    </linearGradient>
    <mask id="dotmask">
      <rect width="1280" height="360" fill="url(#fade)"/>
    </mask>
    <clipPath id="card">
      <rect x="1" y="1" width="1278" height="358" rx="22"/>
    </clipPath>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
      .cursor { animation: blink 1.1s step-end infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .float { animation: float 6s ease-in-out infinite; }
      @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
      @media (prefers-reduced-motion: reduce) { .cursor, .float { animation: none; } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="360" fill="#0f0f17"/>
    <rect width="1280" height="360" fill="url(#dots)" mask="url(#dotmask)"/>
  </g>
  <rect x="1" y="1" width="1278" height="358" rx="22" fill="none" stroke="#262636" stroke-width="2"/>

  <!-- left: text -->
  <text x="72" y="104" class="mono" font-size="20" fill="#8d8da6" textLength="288"><tspan fill="#8075ff">physic@anysola</tspan>:~$ whoami</text>
  <rect class="cursor" x="368" y="87" width="11" height="22" rx="1.5" fill="#8075ff"/>

  <text x="68" y="192" class="sans" font-size="80" font-weight="700" fill="#ececf4" letter-spacing="-2">Mert<tspan font-weight="400" fill="#8d8da6" dx="18">/ physic</tspan></text>

  <text x="72" y="244" class="sans" font-size="24" fill="#8d8da6">Full stack developer. Web, mobile and desktop.</text>

  <g transform="translate(72 280)">
    <rect width="224" height="40" rx="20" fill="#8075ff33"/>
    <circle cx="22" cy="20" r="5" fill="#8075ff"/>
    <text x="38" y="26" class="mono" font-size="17" fill="#8075ff" textLength="163">building anysola</text>
  </g>

  <!-- right: desktop, browser and phone -->
  <g class="float">
    <!-- desktop window -->
    <rect x="808" y="52" width="324" height="204" rx="14" fill="#171724" stroke="#2e2e44" stroke-width="2"/>
    <line x1="808" y1="88" x2="1132" y2="88" stroke="#2e2e44" stroke-width="2"/>
    <circle cx="830" cy="70" r="5" fill="#2e2e44"/>
    <circle cx="848" cy="70" r="5" fill="#2e2e44"/>
    <circle cx="866" cy="70" r="5" fill="#8075ff"/>
    <rect x="832" y="108" width="132" height="10" rx="5" fill="#8075ff"/>
    <rect x="976" y="108" width="72" height="10" rx="5" fill="#2e2e44"/>
    <rect x="852" y="130" width="196" height="10" rx="5" fill="#2e2e44"/>
    <rect x="852" y="152" width="110" height="10" rx="5" fill="#2e2e44"/>
    <rect x="974" y="152" width="58" height="10" rx="5" fill="#8075ff33"/>
    <rect x="832" y="174" width="84" height="10" rx="5" fill="#2e2e44"/>
  </g>

  <g class="float" style="animation-delay: -2s">
    <!-- browser window -->
    <rect x="732" y="168" width="268" height="158" rx="14" fill="#171724" stroke="#2e2e44" stroke-width="2"/>
    <rect x="750" y="184" width="232" height="22" rx="11" fill="none" stroke="#2e2e44" stroke-width="2"/>
    <circle cx="764" cy="195" r="4" fill="#8075ff"/>
    <rect x="776" y="191" width="96" height="8" rx="4" fill="#2e2e44"/>
    <rect x="752" y="224" width="150" height="14" rx="7" fill="#8d8da6" opacity="0.55"/>
    <rect x="752" y="248" width="196" height="9" rx="4.5" fill="#2e2e44"/>
    <rect x="752" y="264" width="160" height="9" rx="4.5" fill="#2e2e44"/>
    <rect x="752" y="288" width="78" height="24" rx="12" fill="#8075ff"/>
    <rect x="840" y="288" width="78" height="24" rx="12" fill="none" stroke="#2e2e44" stroke-width="2"/>
  </g>

  <g class="float" style="animation-delay: -4s">
    <!-- phone -->
    <rect x="1086" y="122" width="116" height="206" rx="22" fill="#171724" stroke="#2e2e44" stroke-width="2"/>
    <rect x="1124" y="134" width="40" height="7" rx="3.5" fill="#2e2e44"/>
    <rect x="1102" y="158" width="84" height="56" rx="10" fill="#8075ff33"/>
    <circle cx="1144" cy="186" r="12" fill="#8075ff"/>
    <rect x="1102" y="226" width="84" height="9" rx="4.5" fill="#2e2e44"/>
    <rect x="1102" y="242" width="58" height="9" rx="4.5" fill="#2e2e44"/>
    <rect x="1102" y="268" width="84" height="28" rx="14" fill="#8075ff"/>
    <rect x="1130" y="310" width="28" height="5" rx="2.5" fill="#2e2e44"/>
  </g>
</svg>
